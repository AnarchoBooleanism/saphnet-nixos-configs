################################
# 🦎 KOMODO COMPOSE - MONGO 🦎 #
################################

## This compose file will deploy:
##   1. MongoDB
##   2. Komodo Core
##   3. Komodo Periphery

services:
  mongo:
    image: mongo:8@sha256:e0ce8c35124d4a9f9785532d1f268f39e9728ffa1cb38f46fa482436424c4bd3
    volumes:
      - mongo-data:/data/db
      - mongo-config:/data/configdb
    environment:
      MONGO_INITDB_ROOT_USERNAME: "${KOMODO_DB_USERNAME}"
      MONGO_INITDB_ROOT_PASSWORD: "${KOMODO_DB_PASSWORD}"
    # ports:
    #   - "27017:27017"
    networks:
      - komodo-network
    command: --quiet --wiredTigerCacheSizeGB 0.25
    restart: unless-stopped
    labels:
      komodo.skip: # Prevent Komodo from stopping with StopAllContainers
  
  core:
    image: ghcr.io/moghtech/komodo-core:2.3.3@sha256:bca73d0eee143066228fb9b80c38a5a2726e573ad2758f7aa92b5c91a8aef1c7
    container_name: komodo-core
    init: true
    depends_on:
      - mongo
    volumes:
      - komodo-keys:/config/keys
      ## Store dated backups of the database - https://komo.do/docs/setup/backup
      - ${COMPOSE_KOMODO_BACKUPS_PATH}:/backups
      ## Store sync files on server
      # - /path/to/syncs:/syncs
      ## Optionally mount a custom core.config.toml
      - ${KOMODO_CONFIG_PATH}:/config/config.toml
      # SOPS key
      - ${KOMODO_SOPS_KEY_PATH}:/root/.config/sops/age/keys.txt:ro
      # Bootstrap sync file
      - ${KOMODO_BOOTSTRAP_SYNC_PATH}:/syncs/bootstrap.toml
    environment:
      KOMODO_DATABASE_ADDRESS: mongo:27017
      KOMODO_DATABASE_USERNAME: "${KOMODO_DB_USERNAME}"
      KOMODO_DATABASE_PASSWORD: "${KOMODO_DB_PASSWORD}"
      # Key file for SOPS, to use in sops commands
      SOPS_AGE_KEY_FILE: "/root/.config/sops/age/keys.txt"
      # More custom vars
      GIT_ACCESS_TOKEN: "${GIT_ACCESS_TOKEN}"
      DOCKER_ACCESS_TOKEN: "${DOCKER_ACCESS_TOKEN}"
      KOMODO_WEBHOOK_SECRET: "${KOMODO_WEBHOOK_SECRET}"
      KOMODO_JWT_SECRET: "${KOMODO_JWT_SECRET}"
    env_file: "${ENV_FILE}"
    ports:
      - "9120:9120"
    networks: # For connecting with other services directly
      - komodo-network
      - central-network
    ## Allows for systemd Periphery connection at 
    ## "https://host.docker.internal:8120"
    # extra_hosts:
    #   - host.docker.internal:host-gateway
    restart: unless-stopped
    labels:
      komodo.skip: # Prevent Komodo from stopping with StopAllContainers

  ## Deploy Periphery container using this block,
  ## or deploy the Periphery binary with systemd using 
  ## https://github.com/moghtech/komodo/tree/main/scripts
  periphery:
    image: ghcr.io/nikhil-gohil/komodo-periphery-sops:v2.3.3@sha256:d1fa164b44b7baa48ac3f67c4e34b8c794f4ef05a9aa9cedecc06003f1b5c5fd # Temporary for now until Komodo adds SOPS or we build in-house solution
    container_name: komodo-periphery
    volumes:
      ## Mount external docker socket
      - /var/run/docker.sock:/var/run/docker.sock
      ## Allow Periphery to see processes outside of container
      - /proc:/proc
      ## Specify the Periphery agent root directory.
      ## Must be the same inside and outside the container,
      ## or docker will get confused. See https://github.com/moghtech/komodo/discussions/180.
      ## Default: /etc/komodo.
      - ${PERIPHERY_ROOT_DIRECTORY:-/etc/komodo}:${PERIPHERY_ROOT_DIRECTORY:-/etc/komodo}
    env_file: ${ENV_FILE}
    networks:
      - komodo-network
    restart: unless-stopped
    labels:
      komodo.skip: # Prevent Komodo from stopping with StopAllContainers

networks:
  komodo-network: # Needed for containers to connect to each other, as central-network is listed in one of them
  central-network:
    name: central-network
    external: true

volumes:
  # Komodo
  komodo-keys:
  # Mongo
  mongo-data:
  mongo-config:
